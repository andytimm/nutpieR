[dependencies.rand_distr]
version = "0.6.0"

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.tokio]
version = "1.0"
