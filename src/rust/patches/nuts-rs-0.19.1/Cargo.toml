[package]
edition = "2024"
name = "nuts-rs"
version = "0.19.1"
authors = [
    "Adrian Seyboldt <adrian.seyboldt@gmail.com>",
    "PyMC Developers <pymc.devs@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Sample from unnormalized densities using Hamiltonian MCMC"
readme = "README.md"
keywords = [
    "statistics",
    "bayes",
]
license = "MIT"
repository = "https://github.com/pymc-devs/nuts-rs"

[features]
arrow = [
    "dep:arrow",
    "dep:arrow-schema",
]
default = [
    "parallel",
    "relaxed-simd",
]
ndarray = ["dep:ndarray"]
parallel = []
relaxed-simd = ["pulp/relaxed-simd"]
zarr = [
    "dep:zarrs",
    "dep:tokio",
]

[lib]
name = "nuts_rs"
path = "src/lib.rs"

[[example]]
name = "arrow_trace"
path = "examples/arrow_trace.rs"
required-features = ["arrow"]

[[example]]
name = "csv_trace"
path = "examples/csv_trace.rs"

[[example]]
name = "hashmap_storage"
path = "examples/hashmap_storage.rs"

[[example]]
name = "ndarray_storage"
path = "examples/ndarray_storage.rs"
required-features = ["ndarray"]

[[example]]
name = "walnuts_funnel"
path = "examples/walnuts_funnel.rs"

[[example]]
name = "zarr_async_trace"
path = "examples/zarr_async_trace.rs"
required-features = ["zarr"]

[[example]]
name = "zarr_trace"
path = "examples/zarr_trace.rs"
required-features = ["zarr"]

[[test]]
name = "queued_panic"
path = "tests/queued_panic.rs"
required-features = ["parallel"]

[[test]]
name = "sample_normal"
path = "tests/sample_normal.rs"
required-features = ["zarr"]

[[bench]]
name = "sample"
path = "benches/sample.rs"
harness = false

[dependencies.anyhow]
